name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["site/**"]   # a shared journal page is not a code change
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and uv
        run: brew install lua uv
      - name: Offline tests (Lua syntax, simulated session, pytest)
        run: scripts/test
      - name: The simulated session is the committed fixture
        run: git diff --exit-code -- companion/tests/fixtures
      - name: Build the companion wheel
        run: cd companion && uv build --wheel
      - name: Package the AddOn
        run: |
          mkdir -p dist
          rm -f addon/Rambleon/Chapters.lua
          (cd addon && zip -r "../dist/Rambleon-${GITHUB_REF_NAME}.zip" Rambleon -x '*.DS_Store')
      - uses: actions/upload-artifact@v4
        with:
          name: rambleon-${{ github.sha }}
          path: |
            dist/*.zip
            companion/dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package the AddOn
        run: |
          mkdir -p dist
          rm -f addon/Rambleon/Chapters.lua
          (cd addon && zip -r "../dist/Rambleon-${GITHUB_REF_NAME}.zip" Rambleon -x '*.DS_Store')
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
